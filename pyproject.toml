[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsuite-scanner"
version = "0.1.0"
description = "Bulk award-availability scanner for Qatar Airways Qsuite business class, calendar-first."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
qsuite = "qsuite.cli:main"

[tool.setuptools.packages.find]
include = ["qsuite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
